{% extends "layout.html" %}

{% block title %}Change Password{% endblock %}

{% block main %}
    <form action="/password" method="post">
        <input autofocus name="current" placeholder="Current Password" type="password" required>
        <input name="new" placeholder="New Password" type="password" required>
        <input name="confirmation" placeholder="Confirm New Password" type="password" required>
        <button type="submit">Change Password</button>
    </form>
{% endblock %}
